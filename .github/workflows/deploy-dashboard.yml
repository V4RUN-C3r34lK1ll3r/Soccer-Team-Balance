name: Deploy auction dashboard

on:
  push:
    branches: [main]
    paths:
      - Renegades_Auction_Dashboard.html
      - dashboard-live.css
      - dashboard-live.js
      - match-plans.html
      - match-plans.css
      - match-plans.js
      - auctions.json
      - renegades-logo.jpg
      - .github/workflows/deploy-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir public
          cp Renegades_Auction_Dashboard.html public/index.html
          cp dashboard-live.css public/dashboard-live.css
          cp dashboard-live.js public/dashboard-live.js
          cp match-plans.html public/match-plans.html
          cp match-plans.css public/match-plans.css
          cp match-plans.js public/match-plans.js
          cp auctions.json public/auctions.json
          cp renegades-logo.jpg public/renegades-logo.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
